<!DOCTYPE html><html lang="en-GB"><head>
    <title>erubinyl.is-a.dev</title>

    <meta name="og:url"         content="https://erubinyl.is-a.dev/">
    <meta name="og:title"       content="ERUBINYL">
    <meta name="og:description" content="Waiting for something special...!">

    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://raw.githubusercontent.com/Erubinyl/is-a.dev/resources/stylesheets/base.required.css">
    <link rel="stylesheet" href="https://raw.githubusercontent.com/Erubinyl/is-a.dev/resources/stylesheets/base.components.css"></head>
<body>
    <p>Did it work?</p>
    <script>
        fetch("https://raw.githubusercontent.com/Erubinyl/is-a.dev/resources/components/footer/footer.html")
            .then(resource => resource.text()).then(content =>
                document.body.appendChild(iframe = Object.assign(document.createElement("iframe"), { srcdoc: content, sandbox: "allow-scripts", className: "iframe-fullscreen" }))
                .onload = () => iframe.contentDocument.querySelectorAll("style").forEach(style => document.head.appendChild(Object.assign(document.createElement("style"), { textContent: style.textContent }))))
            .catch(_ => console.error("Unable to load for iframe.", _));
    </script>
</body>
</html>
